name: MW4 Discord News
on:
  schedule:
    - cron: '0 1 * * *' # 10:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mw4-news
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Monitor and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python monitor.py
      - name: Save notification history
        run: |
          if ! git diff --quiet -- state/seen.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/seen.json
            git commit -m 'Save MW4 notification history'
            git push
          fi
